{% assign images = include.images %}
{% assign carouselId = include.carouselId | prepend: "lab" %}
{% if images.size > 1 %}
<div id="{{ carouselId }}" class="carousel slide album-carousel" data-ride="carousel">
  <ol class="carousel-indicators">
    {% for image in images %}
    <li data-target="#{{ carouselId }}" data-slide-to="{{ forloop.index0 }}"{% if forloop.first %} class="active"{% endif %}></li>
    {% endfor %}
  </ol>
  <div class="carousel-inner">
    {% for image in images %}
    <div class="carousel-item{% if forloop.first %} active{% endif %}">
      <img src="{{ image.path | relative_url }}" alt="{{ include.dateLabel }} image {{ forloop.index }}">
    </div>
    {% endfor %}
  </div>
  <a class="carousel-control-prev" href="#{{ carouselId }}" role="button" data-slide="prev">
    <span class="carousel-control-prev-icon" aria-hidden="true"></span>
    <span class="sr-only">Previous</span>
  </a>
  <a class="carousel-control-next" href="#{{ carouselId }}" role="button" data-slide="next">
    <span class="carousel-control-next-icon" aria-hidden="true"></span>
    <span class="sr-only">Next</span>
  </a>
</div>
{% else %}
<div class="album-single">
  <img src="{{ images[0].path | relative_url }}" alt="{{ include.dateLabel }} image">
</div>
{% endif %}
