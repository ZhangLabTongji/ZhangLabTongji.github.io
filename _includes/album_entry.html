{% assign item = include.item %}
{% if item.images.size > 1 %}
<div id="{{ item.id }}" class="carousel slide album-carousel" data-ride="carousel">
  <ol class="carousel-indicators">
    {% for image in item.images %}
    <li data-target="#{{ item.id }}" data-slide-to="{{ forloop.index0 }}"{% if forloop.first %} class="active"{% endif %}></li>
    {% endfor %}
  </ol>
  <div class="carousel-inner">
    {% for image in item.images %}
    <div class="carousel-item{% if forloop.first %} active{% endif %}">
      <img src="{{ image | relative_url }}" alt="{{ item.date }} image {{ forloop.index }}">
    </div>
    {% endfor %}
  </div>
  <a class="carousel-control-prev" href="#{{ item.id }}" role="button" data-slide="prev">
    <span class="carousel-control-prev-icon" aria-hidden="true"></span>
    <span class="sr-only">Previous</span>
  </a>
  <a class="carousel-control-next" href="#{{ item.id }}" role="button" data-slide="next">
    <span class="carousel-control-next-icon" aria-hidden="true"></span>
    <span class="sr-only">Next</span>
  </a>
</div>
{% else %}
<div class="album-single">
  <img src="{{ item.images[0] | relative_url }}" alt="{{ item.date }} image">
</div>
{% endif %}
