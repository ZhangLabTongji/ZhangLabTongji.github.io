# --- Site identity ------------------------------------------------------------
# Website title shown in browser tab and site header
title: ZhangYF Lab
# Short site description used in metadata and some theme locations
description: Yunfang Zhang Lab at Tongji University
# Footer author / site owner text
author: Yunfang Zhang Lab

# --- Navigation bar -----------------------------------------------------------
# Top navigation menu: left side label -> target path
navbar-links:
  Home: "/"
  News: "news"
  People: "people"
  Publications: "publications"
  Links: "links"
  Contact: "contact"
  Album: "album"

# --- Logo / title display -----------------------------------------------------
# Whether avatar-style images should be displayed as a circle
# Here false means keep original rectangular/square shape
round-avatar: false
# Image used in the top-left title area instead of plain text title
# Path is relative to the site root
title-img: /assets/img/logo.png

# --- Share buttons on posts ---------------------------------------------------
# Control which social/share buttons appear on posts
share-links-active:
  email: true
  github: true
  twitter: false
  facebook: false
  linkedin: false
  vk: false

# --- General page behavior ----------------------------------------------------
# Whether post tags should link to a tag index page
link-tags: true
# Maximum number of words shown in post excerpt previews
excerpt_length: 50

# --- Custom styles and theme colors -------------------------------------------
# Extra CSS files loaded globally on every page
site-css:
  - "/assets/css/custom-styles.css"
# Navbar background color
navbar-col: "#ff7e5f"
# Navbar text color
navbar-text-col: "#3A3838"
# Navbar border color
navbar-border-col: "#D5C6C6"
# Main page background color
page-col: "#FFFFFF"
# Default body text color
text-col: "#404040"
# Default link color
link-col: "#008AFF"
# Hover color for links / interactive elements
hover-col: "#ad9492"
# Footer background color
footer-col: "#E1B5B7"
# Footer text color
footer-text-col: "#3A3838"
# Footer link color
footer-link-col: "#404040"

# --- Title and date format ----------------------------------------------------
# Separator between title pieces in browser title / feeds
title-separator: "-"
# Date display format used by the theme
# Example output: April 3, 2026
date_format: "%B %-d, %Y"

# --- Jekyll core settings -----------------------------------------------------
# Site timezone used for post times and date-related rendering
timezone: "Asia/Shanghai"
# Markdown engine
markdown: kramdown
# Syntax highlighter for code blocks
highlighter: rouge
# URL style for generated posts
permalink: /:year-:month-:day-:title/
# Number of posts per page when pagination is used
paginate: 5

# --- Markdown engine options --------------------------------------------------
kramdown:
  # Enable GitHub Flavored Markdown input behavior
  input: GFM

# --- Default front matter for posts and pages ---------------------------------
# Rules applied automatically to files matching each scope
# This avoids repeating the same front matter in many files
defaults:
  -
    scope:
      # Empty path means apply to all matching files in the project
      path: ""
      # Apply this block only to posts
      type: "posts"
    values:
      # Default layout for posts
      layout: "post"
      # Enable comments on posts
      comments: true
      # Show share buttons on posts
      social-share: true
      # Disable estimated reading time display
      readtime: false
  -
    scope:
      # Apply to all regular pages
      path: ""
    values:
      # Default layout for normal pages
      layout: "page"
      # Show avatar / title image area on pages
      show-avatar: true

# --- Files excluded from build ------------------------------------------------
# These files or folders will not be processed into the final site
exclude:
  - CHANGELOG.md
  - CNAME
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - README.md
  - screenshot.png
  - docs/
  - .bundle/
  - vendor/

# --- Enabled Jekyll plugins ---------------------------------------------------
plugins:
  # Split posts into multiple pages
  - jekyll-paginate
  # Automatically generate sitemap.xml
  - jekyll-sitemap

# --- Custom collections -------------------------------------------------------
# Additional content groups outside standard posts/pages
collections:
  people:
    # Generate standalone output pages for each item in _people
    output: true
  pages:
    # Generate output pages for items in this custom pages collection
    output: true
